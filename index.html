<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uncle Dad's Song of the Day</title>

    <!-- Mobile App Configuration & PWA Icons -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Uncle Dad's">
    <meta name="theme-color" content="#0f172a">
    <link rel="manifest" href="manifest.json">

    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/twitter/twemoji/master/assets/72x72/1f3b5.png">
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/twitter/twemoji/master/assets/72x72/1f3b5.png">

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --glass-bg: rgba(30, 41, 59, 0.85);
            --glass-border: rgba(255, 255, 255, 0.12);
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --card-bg: rgba(15, 23, 42, 0.75);
            --success: #22c55e;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            padding: 1.5rem 1rem;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .app-container {
            width: 100%;
            max-width: 620px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 1.5rem;
            padding: 1.75rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
        }
        header h1 { font-size: 1.35rem; color: var(--accent); }
        .admin-toggle {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            padding: 0.35rem 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .admin-toggle:hover { color: var(--text-main); border-color: var(--accent); }
        
        .player-card {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 1rem;
            padding: 1rem;
            margin-bottom: 1.25rem;
        }
        .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            border-radius: 0.75rem;
            overflow: hidden;
            background: #000;
            margin-bottom: 0.85rem;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%; border: 0;
        }
        .track-meta h2 { font-size: 1.15rem; margin-bottom: 0.35rem; }
        .track-meta p { color: var(--text-muted); font-size: 0.85rem; line-height: 1.4; }
        
        .share-row { display: flex; gap: 0.5rem; margin-top: 0.85rem; }
        .share-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 0.45rem;
            border-radius: 0.5rem;
            font-size: 0.75rem;
            cursor: pointer;
        }
        .share-btn:hover { background: rgba(56, 189, 248, 0.15); border-color: var(--accent); }

        .nav-tabs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .tab-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 0.65rem 0.5rem;
            border-radius: 0.75rem;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active, .tab-btn:hover {
            background: var(--accent);
            color: #0f172a;
            border-color: var(--accent);
        }

        .section-panel {
            display: none;
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 1rem;
            padding: 1.25rem;
        }
        .section-panel.active { display: block; }
        .section-panel h3 { font-size: 1rem; margin-bottom: 0.35rem; color: var(--accent); }
        .section-panel p.subtext { color: var(--text-muted); font-size: 0.8rem; margin-bottom: 0.85rem; }

        .trivia-btn {
            display: block;
            width: 100%;
            text-align: left;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 0.55rem 0.75rem;
            margin-bottom: 0.4rem;
            border-radius: 0.5rem;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .trivia-btn:hover { border-color: var(--accent); }

        .time-machine-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            padding: 0.55rem 0.75rem;
            border-radius: 0.5rem;
            margin-bottom: 0.45rem;
            font-size: 0.82rem;
            cursor: pointer;
        }
        .time-machine-item:hover { border-color: var(--accent); }

        .vote-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            padding: 0.65rem 0.75rem;
            border-radius: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
        }
        .pitch-inputs { display: flex; gap: 0.5rem; margin-top: 0.75rem; }
        .pitch-inputs input {
            flex: 1;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 0.5rem;
            border-radius: 0.5rem;
            font-size: 0.8rem;
        }

        .admin-form input, .admin-form textarea {
            width: 100%;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 0.55rem;
            border-radius: 0.5rem;
            margin-bottom: 0.65rem;
            font-size: 0.85rem;
        }
        .primary-btn {
            width: 100%;
            background: var(--accent);
            color: #0f172a;
            border: 0;
            padding: 0.65rem;
            border-radius: 0.5rem;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .primary-btn:hover { background: var(--accent-hover); }
        .reset-btn {
            background: transparent;
            border: 1px solid var(--danger);
            color: var(--danger);
            margin-top: 0.5rem;
        }
        .reset-btn:hover { background: rgba(239, 68, 68, 0.15); }
    </style>
</head>
<body>
    <div class="app-container">
        <header>
            <h1>🎵 Uncle Dad's Song of the Day</h1>
            <button class="admin-toggle" onclick="toggleAdmin()">Bob's Admin</button>
        </header>

        <button id="pwa-install-btn" class="primary-btn" style="margin-bottom: 1rem; background: #22c55e;" onclick="installPWA()">
            📲 Add Shortcut to Home Screen
        </
