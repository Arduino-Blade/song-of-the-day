<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uncle Dad's Song of the Day</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <style>
        :root { --bg-dark: #090d16; --surface: #131b2e; --surface-elevated: #1e293b; --accent: #38bdf8; --text-main: #f8fafc; --text-muted: #94a3b8; --border: rgba(255, 255, 255, 0.1); }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg-dark); color: var(--text-main); margin: 0; padding: 1rem; padding-bottom: 5rem; }
        .app-shell { max-width: 600px; margin: auto; background: var(--surface); padding: 1.2rem; border-radius: 1rem; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid var(--border); }
        
        /* Profile Header */
        .profile-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; padding-bottom: 0.8rem; border-bottom: 1px solid var(--border); }
        .profile-info { display: flex; align-items: center; gap: 0.6rem; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: bold; color: #000; }
        .user-stats { font-size: 0.85rem; color: var(--text-muted); }
        .auth-btn { background: var(--accent); color: #000; border: none; padding: 0.4rem 0.8rem; border-radius: 0.4rem; font-weight: bold; cursor: pointer; font-size: 0.85rem; }

        h1 { font-size: 1.3rem; margin: 0 0 0.8rem 0; text-align: center; color: var(--accent); }
        .player-card, .trivia-card { background: var(--surface-elevated); padding: 1rem; border-radius: 0.8rem; margin-bottom: 1rem; border: 1px solid var(--border); }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 0.5rem; background: #000; margin-bottom: 0.8rem; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        
        /* Vibe Reactions */
        .reaction-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.4rem; margin-top: 0.8rem; }
        .reaction-pill { background: var(--surface); border: 1px solid var(--border); color: var(--text-main); padding: 0.5rem 0.2rem; border-radius: 0.6rem; font-size: 0.82rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.35rem; transition: all 0.2s; }
        .reaction-pill:hover { border-color: var(--accent); background: rgba(56, 189, 248, 0.12); }
        .floating-emoji { position: fixed; pointer-events: none; z-index: 99999; font-size: 1.8rem; animation: floatUpAndFade 1.6s ease-out forwards; }
        @keyframes floatUpAndFade { 0% { transform: translateY(0px) scale(0.6); opacity: 1; } 100% { transform: translateY(-130px) scale(1.3); opacity: 0; } }

        /* Navigation Tabs */
        .nav-tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.4rem; margin-bottom: 1rem; }
        .nav-tab { background: var(--surface-elevated); border: 1px solid var(--border); color: var(--text-muted); padding: 0.6rem; text-align: center; border-radius: 0.6rem; cursor: pointer; font-size: 0.85rem; font-weight: 600; }
        .nav-tab.active { background: var(--accent); color: #000; border-color: var(--accent); }

        .panel { display: none; }
        .panel.active { display: block; }
        .section-title { font-size: 1rem; margin: 1rem 0 0.5rem 0; color: var(--text-muted); font-weight: 600; }
        
        /* Lists & Buttons */
        .list-container { display: flex; flex-direction: column; gap: 0.5rem; max-height: 300px; overflow-y: auto; }
        .list-item { background: var(--surface-elevated); padding: 0.7rem 0.9rem; border-radius: 0.5rem; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border); }
        .vote-btn { background: var(--accent); color: #000; border: none; padding: 0.3rem 0.6rem; border-radius: 0.4rem; font-weight: bold; cursor: pointer; }
        
        /* Trivia Options */
        .trivia-options { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.8rem; }
        .trivia-btn { background: var(--surface); border: 1px solid var(--border); color: #fff; padding: 0.6rem; border-radius: 0.5rem; text-align: left; cursor: pointer; font-weight: 500; }
        .trivia-btn:hover { border-color: var(--accent); }

        /* Pitch Box */
        .pitch-box { margin-top: 1rem; display: flex; flex-direction: column; gap: 0.5rem; background: var(--surface-elevated); padding: 0.8rem; border-radius: 0.6rem; border: 1px solid var(--border); }
        .pitch-box input { background: var(--bg-dark); border: 1px solid var(--border); color: #fff; padding: 0.5rem; border-radius: 0.4rem; }
        .primary-btn { background: var(--accent); color: #000; border: none; padding: 0.5rem; border-radius: 0.4rem; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="app-shell">
        <!-- Profile Header -->
        <div class="profile-header">
            <div class="profile-info">
                <div class="avatar" id="user-avatar">UD</div>
                <div>
                    <div id="user-name" style="font-weight: bold; font-size: 0.9rem;">Guest User</div>
                    <div class="user-stats" id="user-stats-text">🔥 1-Day Streak • 50 Pts</div>
                </div>
            </div>
            <button class="auth-btn" id="auth-action-btn" onclick="toggleAuth()">Sign In</button>
        </div>

        <h1>🎵 Uncle Dad's Song of the Day</h1>

        <!-- Navigation Tabs -->
        <div class="nav-tabs">
            <div class="nav-tab active" onclick="switchTab('player')">🎵 Player</div>
            <div class="nav-tab" onclick="switchTab('trivia')">❓ Trivia</div>
            <div class="nav-tab" onclick="switchTab('voting')">🗳️ Vote</div>
            <div class="nav-tab" onclick="switchTab('archive')">⏱️ Archive</div>
        </div>

        <!-- Tab 1: Player & Reactions -->
        <div id="panel-player" class="panel active">
            <div class="player-card">
                <div id="song-title" style="font-weight: bold; margin-bottom: 0.5rem; font-size: 1.1rem;">Loading Today's Track...</div>
                <div class="video-container">
                    <iframe id="yt-player" src="" allowfullscreen></iframe>
                </div>
                <div id="song-comment" style="color: var(--text-muted); font-size: 0.9rem; font-style: italic; margin-bottom: 0.5rem;"></div>

                <!-- Vibe Reactions -->
                <div class="reaction-bar">
                    <button class="reaction-pill" onclick="sendReaction('fire', '🔥')">🔥 <span id="cnt-fire">0</span></button>
                    <button class="reaction-pill" onclick="sendReaction('classic', '🎸')">🎸 <span id="cnt-classic">0</span></button>
                    <button class="reaction-pill" onclick="sendReaction('groove', '🕺')">🕺 <span id="cnt-groove">0</span></button>
                    <button class="reaction-pill" onclick="sendReaction('skip', '💤')">💤 <span id="cnt-skip">0</span></button>
                </div>
            </div>
        </div>

        <!-- Tab 2: Daily Trivia -->
        <div id="panel-trivia" class="panel">
            <div class="trivia-card">
                <div style="font-size: 0.85rem; color: var(--accent); font-weight: bold; margin-bottom: 0.3rem;">DAILY MUSIC CHALLENGE (+100 Pts)</div>
                <div id="trivia-question" style="font-weight: 600; font-size: 1.05rem; margin-bottom: 0.8rem;">Loading today's trivia question...</div>
                <div class="trivia-options" id="trivia-options-box"></div>
                <div id="trivia-result" style="margin-top: 0.8rem; font-weight: bold; font-size: 0.9rem;"></div>
            </div>
        </div>

        <!-- Tab 3: Voting & Pitching Board -->
        <div id="panel-voting" class="panel">
            <div class="section-title">Community Voting Board (Reaches 3 Votes = Promotes!)</div>
            <div class="list-container" id="suggestions-list"></div>
            <div class="pitch-box">
                <input type="text" id="pitch-title" placeholder="Song Title & Artist...">
                <input type="text" id="pitch-url" placeholder="YouTube Video ID (e.g. dQw4w9WgXcQ)...">
                <button class="primary-btn" onclick="submitPitch()">Pitch Song (+25 Pts)</button>
            </div>
        </div>

        <!-- Tab 4: Archive -->
        <div id="panel-archive" class="panel">
            <div class="section-title">30-Day Curated Archive</div>
            <div class="list-container" id="archive-list"></div>
        </div>
    </div>

    <script>
        firebase.initializeApp({ 
            apiKey: "AIzaSyAzcgw5rzUbWERIhLinXv_cNZe9IkG9deM", 
            databaseURL: "https://uncle-dads-song-of-the-day-default-rtdb.firebaseio.com" 
        });
        const db = firebase.database();
        const auth = firebase.auth();

        let currentUser = null;
        let activeSongKey = 'default_track';
        const VOTE_THRESHOLD = 3; // Promotes when votes reach 3

        const curatedTracks = [
            { 
                id: 'dQw4w9WgXcQ', 
                title: "Rick Astley - Never Gonna Give You Up", 
                comment: "The ultimate family classic!",
                trivia: { q: "In what year was Never Gonna Give You Up released?", options: ["1985", "1987", "1991"], correct: 1 }
            },
            { 
                id: 'L_LUpnjgPso', 
                title: "Eagles - Hotel California", 
                comment: "Such a lovely place.",
                trivia: { q: "What instrument carries the famous closing outro melody?", options: ["Dual Electric Guitars", "Grand Piano", "Saxophone"], correct: 0 }
            },
            { 
                id: 'kJQP7kiw5Fk', 
                title: "Luis Fonsi - Despacito", 
                comment: "Bringing the groove.",
                trivia: { q: "Which artist features alongside Luis Fonsi on Despacito?", options: ["Daddy Yankee", "Bad Bunny", "J Balvin"], correct: 0 }
            }
        ];

        // Auth State
        auth.onAuthStateChanged(user => {
            currentUser = user;
            if (user) {
                document.getElementById('user-name').textContent = user.displayName || user.email.split('@')[0];
                document.getElementById('user-avatar').textContent = (user.displayName || user.email)[0].toUpperCase();
                document.getElementById('auth-action-btn').textContent = 'Sign Out';
                loadUserStats(user.uid);
            } else {
                document.getElementById('user-name').textContent = 'Guest User';
                document.getElementById('user-avatar').textContent = 'UD';
                document.getElementById('auth-action-btn').textContent = 'Sign In';
            }
        });

        function toggleAuth() {
            if (currentUser) {
                auth.signOut();
            } else {
                const email = prompt("Enter email:");
                const pass = prompt("Enter password:");
                if (email && pass) {
                    auth.signInWithEmailAndPassword(email, pass).catch(() => {
                        auth.createUserWithEmailAndPassword(email, pass);
                    });
                }
            }
        }

        function loadUserStats(uid) {
            db.ref('users/' + uid).on('value', snap => {
                const data = snap.val() || { streak: 1, points: 50 };
                document.getElementById('user-stats-text').textContent = `🔥 ${data.streak}-Day Streak • ${data.points} Pts`;
            });
        }

        function switchTab(tabId) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.getElementById('panel-' + tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        // Init App & Listen to currentSong override
        function initApp() {
            const archiveEl = document.getElementById('archive-list');
            curatedTracks.forEach((t, index) => {
                const div = document.createElement('div');
                div.className = 'list-item';
                div.innerHTML = `<span>Day ${index + 1}: ${t.title}</span>`;
                div.onclick = () => loadTrackData('song_' + index, t);
                archiveEl.appendChild(div);
            });

            // Listen for live promoted song or default to Day 1
            db.ref('currentSong').on('value', snap => {
                const val = snap.val();
                if (val && val.videoId) {
                    setSongDisplay('promoted_song', val.title, val.comment || 'Community Consensus Pick!', val.videoId, val.trivia);
                } else {
                    loadTrackData('song_0', curatedTracks[0]);
                }
            });

            loadSuggestions();
        }

        function loadTrackData(key, track) {
            setSongDisplay(key, track.title, track.comment, track.id, track.trivia);
        }

        function setSongDisplay(key, title, comment, ytId, triviaObj) {
            activeSongKey = key;
            document.getElementById('song-title').textContent = title;
            document.getElementById('song-comment').textContent = comment ? `"${comment}"` : '';
            document.getElementById('yt-player').src = `https://www.youtube.com/embed/${ytId}`;
            setupReactionListener(activeSongKey);

            if (triviaObj) {
                setupTrivia(triviaObj);
            } else {
                document.getElementById('trivia-question').textContent = "No trivia for this community pick!";
                document.getElementById('trivia-options-box').innerHTML = '';
            }
        }

        function setupTrivia(trivia) {
            document.getElementById('trivia-question').textContent = trivia.q;
            const box = document.getElementById('trivia-options-box');
            box.innerHTML = '';
            document.getElementById('trivia-result').textContent = '';

            trivia.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'trivia-btn';
                btn.textContent = opt;
                btn.onclick = () => {
                    const res = document.getElementById('trivia-result');
                    if (idx === trivia.correct) {
                        res.style.color = '#4ade80';
                        res.textContent = '🎉 Correct! +100 Points awarded!';
                        if (currentUser) {
                            db.ref('users/' + currentUser.uid + '/points').transaction(p => (p || 50) + 100);
                        }
                    } else {
                        res.style.color = '#f87171';
                        res.textContent = '❌ Not quite! Try again.';
                    }
                };
                box.appendChild(btn);
            });
        }

        // Vibe Reactions
        function sendReaction(type, emoji) {
            db.ref('reactions/' + activeSongKey + '/' + type).transaction(val => (val || 0) + 1);
            const el = document.createElement('div');
            el.className = 'floating-emoji';
            el.textContent = emoji;
            el.style.left = (window.innerWidth / 2 + (Math.random() * 140 - 70)) + 'px';
            el.style.bottom = '120px';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1600);
        }

        function setupReactionListener(songId) {
            db.ref('reactions/' + songId).off();
            db.ref('reactions/' + songId).on('value', snap => {
                const val = snap.val() || {};
                document.getElementById('cnt-fire').textContent = val.fire || 0;
                document.getElementById('cnt-classic').textContent = val.classic || 0;
                document.getElementById('cnt-groove').textContent = val.groove || 0;
                document.getElementById('cnt-skip').textContent = val.skip || 0;
            });
        }

        // Voting & Consensus Promotion Logic
        function submitPitch() {
            const title = document.getElementById('pitch-title').value;
            const videoId = document.getElementById('pitch-url').value;
            if (!title || !videoId) return alert('Please enter both title and YouTube ID.');
            
            db.ref('suggestions').push({
                title: title,
                videoId: videoId.trim(),
                votes: 1,
                pitchedBy: currentUser ? currentUser.email.split('@')[0] : 'Guest',
                trivia: { q: `What makes ${title} a great family pick?`, options: ["The beat", "The nostalgia", "Everything"], correct: 2 }
            });
            document.getElementById('pitch-title').value = '';
            document.getElementById('pitch-url').value = '';
            switchTab('voting');
        }

        function loadSuggestions() {
            db.ref('suggestions').on('value', snap => {
                const list = document.getElementById('suggestions-list');
                list.innerHTML = '';
                const data = snap.val() || {};
                Object.entries(data).forEach(([key, item]) => {
                    const div = document.createElement('div');
                    div.className = 'list-item';
                    div.innerHTML = `<div><strong>${item.title}</strong><br><small style="color:var(--text-muted)">Pitched by @${item.pitchedBy || 'Family'} • ${item.votes || 0} Votes</small></div>
                                     <button class="vote-btn" onclick="voteSong('${key}', ${item.votes || 0}, '${item.title}', '${item.videoId}')">👍 Vote</button>`;
                    list.appendChild(div);
                });
            });
        }

        function voteSong(key, currentVotes, title, videoId) {
            const newVotes = currentVotes + 1;
            db.ref('suggestions/' + key + '/votes').set(newVotes);

            // Check consensus promotion threshold
            if (newVotes >= VOTE_THRESHOLD) {
                db.ref('currentSong').set({
                    title: title,
                    videoId: videoId,
                    comment: `Promoted by community consensus (${newVotes} votes)!`
                });
                db.ref('suggestions/' + key).remove(); // Clear from board
                alert(`🏆 "${title}" reached ${newVotes} votes and is now Today's Featured Song!`);
                switchTab('player');
            }
        }

        initApp();
    </script>
</body>
</html>
